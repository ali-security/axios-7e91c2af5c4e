name: CI

on:
  push:
    branches:
      - '*'
      - '*/*'
      - '**'
      - '!sponsors'
  pull_request:
    branches:
      - '*'
      - '*/*'
      - '**'
      - '!sponsors'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [12.x, 14.x, 16.x, 18.x, 20.x, 22.x, 23.x]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      # Install deps so the husky `prepare` lifecycle (run by npm pack) succeeds,
      # exactly as it did at release. dist/ is committed at the tag and is not
      # rebuilt here, so the packed tree matches the public npm artifact
      # byte-for-byte.
      - run: npm ci
      - name: Pack tarball
        run: npm pack
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: axios-tgz
          path: axios-1.8.2.tgz
          if-no-files-found: error
